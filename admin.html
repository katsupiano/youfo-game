<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>運営入力 | YOU.FO体験会</title>
<style>
:root{
  --red:#d5102a; --red-dark:#a80c20; --ink:#1b1b1f; --paper:#f7f6f3;
  --card:#ffffff; --line:#e8e5df; --muted:#8a8781; --gold:#c9a227;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  background:#efeeea; color:var(--ink); min-height:100vh;
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}
header.hero{
  background:linear-gradient(120deg,var(--red) 0%,var(--red-dark) 100%);
  color:#fff; padding:20px 18px 14px; position:relative; overflow:hidden;
}
header.hero::after{
  content:""; position:absolute; right:-40px; top:-60px; width:190px; height:190px;
  border:14px solid rgba(255,255,255,.14); border-radius:50%;
}
.hero .kicker{font-size:.72rem; letter-spacing:.22em; opacity:.9; font-weight:700}
.hero h1{font-size:1.42rem; font-weight:800; line-height:1.3; margin-top:2px}
.hero .sub{font-size:.78rem; opacity:.85; margin-top:4px}
.tabs{display:flex; gap:8px}
.tab{
  flex:1; border:2px solid var(--line); background:var(--card); border-radius:12px;
  padding:13px 4px; text-align:center; font-weight:700; font-size:.95rem; cursor:pointer;
  color:var(--muted); transition:.15s;
}
.tab.on{border-color:var(--red); color:var(--red); background:#fff5f6}
.tab .em{font-size:1.1rem; display:block; margin-bottom:1px}
.card{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:16px; margin-top:14px}
label.fl{display:block; font-size:.78rem; font-weight:800; color:var(--muted); margin:12px 0 5px}
input[type=text], input[type=number], input[type=password]{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
  font-size:16px; outline:none; background:#fff;
}
input:focus{border-color:var(--red)}
.scorein{display:flex; align-items:center; gap:10px}
.scorein input{font-size:1.6rem; font-weight:900; text-align:center}
.scorein .unit{font-weight:800; color:var(--muted); flex-shrink:0}
.btn{
  width:100%; border:none; border-radius:12px; padding:15px; font-size:1.05rem;
  font-weight:800; cursor:pointer; margin-top:16px;
  background:var(--red); color:#fff;
}
.btn:disabled{opacity:.5}
.btn.sub{background:#fff; color:var(--ink); border:1.5px solid var(--line); margin-top:10px; font-size:.85rem; padding:10px}
.ok{
  background:#0d7a3f; color:#fff; border-radius:12px; padding:13px 16px; font-weight:700;
  font-size:.92rem; margin-top:14px; display:none; line-height:1.5;
}
.err{background:var(--red-dark)}
.hist .row{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:.88rem}
.hist .row:first-of-type{border-top:none}
.hist .g{font-size:.65rem; font-weight:800; border-radius:6px; padding:2px 6px; background:#fff5f6; color:var(--red); flex-shrink:0}
.hist .nm{flex:1; min-width:0; font-weight:700; word-break:break-all}
.hist .sc{font-weight:900}
.hist .del{
  border:1.5px solid var(--line); background:#fff; color:var(--muted); border-radius:8px;
  font-size:.7rem; font-weight:700; padding:5px 9px; cursor:pointer; flex-shrink:0;
}
.pairtoggle{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:.85rem; font-weight:700; color:var(--muted)}
.pairtoggle input{width:auto}
#gate{position:fixed; inset:0; background:#efeeea; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px}
#gate .card{width:100%; max-width:360px; margin-top:0}
h2{font-size:1rem; margin-bottom:4px}
.hint{font-size:.74rem; color:var(--muted)}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <h2>&#128274; 運営スタッフ用</h2>
    <p class="hint">PINを入力してください</p>
    <label class="fl">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <button class="btn" id="enter">入る</button>
    <p class="hint" id="gateerr" style="color:var(--red); margin-top:8px; display:none">PINが違います</p>
  </div>
</div>
<header class="hero">
  <div class="kicker">STAFF ONLY</div>
  <h1>記録の入力</h1>
  <div class="sub">YOU.FO体験会 ミニゲームランキング 運営画面</div>
</header>
<div class="wrap">
  <div class="ok" id="okmsg"></div>
  <div class="card">
    <label class="fl" style="margin-top:0">種目</label>
    <div class="tabs" id="gsel">
      <div class="tab on" data-g="strike"><span class="em">&#127919;</span>ストラックアウト</div>
      <div class="tab" data-g="rally"><span class="em">&#128257;</span>リングラリー</div>
    </div>
    <label class="fl">ニックネーム</label>
    <input id="name1" type="text" placeholder="例: かつさん" autocomplete="off">
    <div class="pairtoggle"><input type="checkbox" id="ispair"><label for="ispair">ペアで挑戦(2人目を入力)</label></div>
    <div id="p2" style="display:none">
      <label class="fl">ニックネーム(2人目)</label>
      <input id="name2" type="text" placeholder="例: ゆうさん" autocomplete="off">
    </div>
    <label class="fl">部門(任意)</label>
    <input id="division" type="text" list="divs" placeholder="例: 小学生以下 / 一般 など" autocomplete="off">
    <datalist id="divs">
      <option value="小学生以下"></option>
      <option value="中高生"></option>
      <option value="一般"></option>
      <option value="親子ペア"></option>
    </datalist>
    <label class="fl">スコア</label>
    <div class="scorein">
      <input id="score" type="number" inputmode="numeric" min="0" max="9999" placeholder="0">
      <span class="unit" id="unit">点</span>
    </div>
    <button class="btn" id="submit">この記録を登録する</button>
  </div>
  <div class="card hist">
    <h2>直近の登録 <span class="hint">(まちがえたら取消)</span></h2>
    <div id="hist"></div>
  </div>
  <button class="btn sub" onclick="location.href='./index.html'">&#128065; 閲覧ページを開く</button>
</div>
<script>
var BASE = "https://bhvtqqaedqjrdlnvuekd.supabase.co/functions/v1/taikenkai";
var game = "strike";
var UNITS = { strike: "点", rally: "回" };
var GLABEL = { strike: "ストラックアウト", rally: "リングラリー" };

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function pin(){ return localStorage.getItem("tk_pin") || ""; }
function gate(show){ document.getElementById("gate").style.display = show ? "flex" : "none"; }

function checkPin(p){
  return fetch(BASE + "/api/checkpin", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pin: p })
  }).then(function(r){ return r.ok; });
}

document.getElementById("enter").addEventListener("click", function(){
  var p = document.getElementById("pin").value.trim();
  checkPin(p).then(function(ok){
    if (ok){ localStorage.setItem("tk_pin", p); gate(false); loadHist(); }
    else document.getElementById("gateerr").style.display = "block";
  });
});

document.getElementById("gsel").addEventListener("click", function(ev){
  var t = ev.target.closest(".tab"); if (!t) return;
  game = t.getAttribute("data-g");
  document.querySelectorAll("#gsel .tab").forEach(function(x){ x.classList.toggle("on", x === t); });
  document.getElementById("unit").textContent = UNITS[game];
});

document.getElementById("ispair").addEventListener("change", function(){
  document.getElementById("p2").style.display = this.checked ? "block" : "none";
});

function msg(text, isErr){
  var el = document.getElementById("okmsg");
  el.innerHTML = text;
  el.classList.toggle("err", !!isErr);
  el.style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
  clearTimeout(msg._t);
  msg._t = setTimeout(function(){ el.style.display = "none"; }, 6000);
}

document.getElementById("submit").addEventListener("click", function(){
  var n1 = document.getElementById("name1").value.trim();
  var n2 = document.getElementById("ispair").checked ? document.getElementById("name2").value.trim() : "";
  var dv = document.getElementById("division").value.trim();
  var sc = document.getElementById("score").value;
  if (!n1) return msg("ニックネームを入力してください", true);
  if (sc === "" || isNaN(Number(sc)) || Number(sc) < 0) return msg("スコアを入力してください", true);
  var btn = document.getElementById("submit");
  btn.disabled = true;
  fetch(BASE + "/api/add", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pin: pin(), game: game, name1: n1, name2: n2 || null, division: dv || null, score: Number(sc) })
  }).then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
  .then(function(res){
    btn.disabled = false;
    if (!res.ok){
      if (res.d && res.d.error === "bad_pin"){ localStorage.removeItem("tk_pin"); gate(true); return; }
      return msg("登録に失敗しました。もう一度お試しください", true);
    }
    var nm = n2 ? n1 + " & " + n2 : n1;
    msg("&#127881; 登録しました!<br><b>" + esc(nm) + "</b> さんは " + GLABEL[game] + " で現在 <b>" + res.d.rank + "位</b> です");
    document.getElementById("name1").value = "";
    document.getElementById("name2").value = "";
    document.getElementById("score").value = "";
    loadHist();
  }).catch(function(){ btn.disabled = false; msg("通信エラー。電波を確認してください", true); });
});

function loadHist(){
  fetch(BASE + "/api/state").then(function(r){ return r.json(); }).then(function(d){
    var list = (d.entries || []).slice().sort(function(a,b){
      return new Date(b.created_at) - new Date(a.created_at);
    }).slice(0, 15);
    var out = "";
    list.forEach(function(e){
      var t = new Date(e.created_at);
      var hm = ("0" + t.getHours()).slice(-2) + ":" + ("0" + t.getMinutes()).slice(-2);
      out += '<div class="row"><span class="g">' + (e.game === "strike" ? "スト" : "ラリー") + "</span>"
        + '<span class="nm">' + esc(e.name2 ? e.name1 + " & " + e.name2 : e.name1)
        + ' <span class="hint">' + hm + "</span></span>"
        + '<span class="sc">' + e.score + UNITS[e.game] + "</span>"
        + '<button class="del" data-id="' + e.id + '">取消</button></div>';
    });
    document.getElementById("hist").innerHTML = out || '<p class="hint">まだ登録がありません</p>';
  });
}

document.getElementById("hist").addEventListener("click", function(ev){
  var b = ev.target.closest(".del"); if (!b) return;
  if (!confirm("この記録を取り消しますか?")) return;
  fetch(BASE + "/api/remove", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pin: pin(), id: b.getAttribute("data-id") })
  }).then(function(r){
    if (r.ok){ msg("取り消しました"); loadHist(); }
    else msg("取消に失敗しました", true);
  });
});

if (pin()){
  checkPin(pin()).then(function(ok){
    if (ok){ gate(false); loadHist(); }
    else { localStorage.removeItem("tk_pin"); gate(true); }
  });
} else {
  gate(true);
}
</script>
</body>
</html>
